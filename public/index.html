<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mini Multiplayer Game</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      background: #111;
      color: white;
    }

    button {
      padding: 20px;
      font-size: 20px;
      cursor: pointer;
      margin-top: 20px;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      background: #222;
      margin: 5px;
      padding: 10px;
    }
  </style>
</head>

<body>

  <h1>🔥 Click Race Multiplayer</h1>

  <p>Puntos: <span id="score">0</span></p>
  <button onclick="addPoint()">CLICK!</button>

  <h2>🏆 Leaderboard</h2>
  <ul id="leaderboard"></ul>

  <script>
    let score = 0;
    let username = prompt("Escribe tu nombre:");

    function addPoint() {
      score++;
      document.getElementById("score").innerText = score;

      fetch("/score", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          username: username,
          score: score
        })
      });
    }

    async function loadLeaderboard() {
      const res = await fetch("/score");
      const data = await res.json();

      const list = document.getElementById("leaderboard");
      list.innerHTML = "";

      data.forEach(player => {
        const li = document.createElement("li");
        li.innerText = player.username + " - " + player.score;
        list.appendChild(li);
      });
    }

    setInterval(loadLeaderboard, 2000);
  </script>

</body>
</html>
